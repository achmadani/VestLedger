---
# Deploy config untuk cPanel "Git™ Version Control" (Biznet, TANPA SSH).
#
# Prasyarat (disiapkan manual sekali di server, TIDAK ditangani berkas ini):
#   - vendor/  → diunggah ke dalam folder repo hasil clone
#   - .env     → dibuat/diisi di root folder repo (CI_ENVIRONMENT=production,
#                app.baseURL, kredensial DB, encryption.key)
#   - Database → dibuat & diimpor lewat phpMyAdmin (skema: lihat deploy/*.sql)
#
# Yang dilakukan berkas ini setiap kali "Deploy HEAD Commit" ditekan
# (atau dipanggil GitHub Actions lewat API — lihat .github/workflows/deploy.yml):
#   1. Menyalin ISI folder public/ (termasuk .htaccess, assets, favicon) ke
#      document root subdomain.
#   2. Menimpa index.php di document root dengan versi yang menunjuk balik ke root
#      repo (deploy/index-docroot.php), sehingga app/, vendor/, dan .env TETAP di
#      luar web root.
#
# Catatan penting:
#   - SATU-satunya path yang perlu disesuaikan adalah DEPLOYPATH (document root
#     subdomain) di bawah. Path repo TIDAK di-hardcode — dideteksi otomatis via
#     $(pwd), karena cPanel menjalankan task dari root folder repo.
#   - Document root subdomain HARUS terpisah dari repo (di public_html), BUKAN
#     diarahkan ke folder public/ di dalam repo. Bila diarahkan ke dalam repo,
#     cPanel menulis handler PHP ke public/.htaccess yang di-commit, membuat
#     working tree kotor dan memblokir deploy berikutnya.
#   - Ditulis sebagai SATU task berantai (&&) supaya $DEPLOYPATH dan $(pwd) tetap
#     valid dalam satu shell (cPanel tidak menjamin variabel lintas-task).
#   - rsync/composer/spark sengaja TIDAK dipakai (sering tidak tersedia / gagal di
#     shared hosting). Migrasi skema dijalankan manual lewat deploy/*.sql di
#     phpMyAdmin, atau `spark migrate` dari mesin lokal via Remote MySQL (§6).

deployment:
  tasks:
    - 'export DEPLOYPATH=/home/sinaubiz/public_html/jurnal.sinau.biz.id && /bin/mkdir -p "$DEPLOYPATH" && /bin/cp -Rf public/. "$DEPLOYPATH"/ && /bin/cp -f deploy/index-docroot.php "$DEPLOYPATH"/index.php && /bin/sed -i "s#__APPROOT__#$(pwd)#g" "$DEPLOYPATH"/index.php'
